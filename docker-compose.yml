services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      FLASK_ENV: production
      MOVIESHUB_DATABASE: /data/movieshub.db
      MOVIESHUB_UPLOAD_DIR: /data/uploads
      MOVIESHUB_POSTER_DIR: /data/uploads/posters
      MOVIESHUB_USERNAME: ${MOVIESHUB_USERNAME:-owner}
      MOVIESHUB_PASSWORD: ${MOVIESHUB_PASSWORD:?Set MOVIESHUB_PASSWORD in .env}
      MOVIESHUB_SECRET: ${MOVIESHUB_SECRET:?Set MOVIESHUB_SECRET in .env}
      MOVIESHUB_COOKIE_SECURE: ${MOVIESHUB_COOKIE_SECURE:-1}
      MOVIESHUB_MAX_UPLOAD_MB: ${MOVIESHUB_MAX_UPLOAD_MB:-500}
    volumes:
      - movieshub-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  movieshub-data:
