{% extends "base.html" %}
{% block title %}Add Song - MoviesHub{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Add Song</h1>
    <p class="auth-note">Upload an audio track to the MoviesHub catalog.</p>
    <form method="post" action="{{ url_for('upload_song') }}" enctype="multipart/form-data" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
            <label for="title">Song title *</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="field">
            <label for="artist">Artist</label>
            <input type="text" id="artist" name="artist">
        </div>
        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>
        <div class="field">
            <label for="audio">Audio file *</label>
            <input type="file" id="audio" name="audio" accept="audio/*" required>
            <small>Supported formats: mp3, wav, m4a, aac, ogg, and flac.</small>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Upload Song</button>
    </form>
    <a href="{{ url_for('songs') }}" class="back-link">&larr; Back to songs</a>
</section>
{% endblock %}
